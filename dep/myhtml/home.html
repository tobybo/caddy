<!DOCTYPE html>
<html lang="zh">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIY 工作室</title>
    <div id="loginBtn" onclick="on_click_login()"></div>
    <link rel="stylesheet" href="./css/home.css">
</head>
<body>
    <header>
        <h1>欢迎来到我们的 DIY 工作室</h1>
        <p>在这里，我们分享我们的创意和作品！</p>
    </header>

    <main>
        <section class="photo-gallery">
            <h2>我们的作品</h2>
            <div class="gallery" id="gallery"></div>
        </section>

        <div class="image-gallery-container">
            <div class="image-gallery" id="image-container"></div>
            <div class="upload-box" id="upload-box">
                <span class="upload-icon">+</span>
            </div>
        </div>

        <section class="contact">
            <h2>联系方式</h2>
            <p>如果您对我们的作品感兴趣，欢迎与我们联系！</p>
            <p>邮箱：example@diystudio.com</p>
            <p>电话：123-456-7890</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 DIY 工作室. 保留所有权利.</p>
    </footer>

    <script src="./js/home.js"></script>

</html>
